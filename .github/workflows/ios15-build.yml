name: iOS 15 / A9 build

# Builds Henge for iOS 15 and later (iPhone 6s / SE and up) on a GitHub macOS
# runner and uploads the unsigned-but-ad-hoc-signed .ipa. Nothing here needs a
# Husk checkout: this build has no libslirp/glib and no StikJIT, so the whole
# toolchain is Xcode, xcodegen and cmake, all present on the image.
#
# The second job is the oracle for the emulation in core/simd.c: on an Apple
# Silicon runner every emulated instruction is executed natively first and then
# through the emulator, and all lanes are compared bit for bit.
#
# The .ipa is small on purpose: it carries the emulator and the installer, not
# macOS. The Mac's restore image is downloaded from Apple on the device when a
# Mac is installed (see docs/ios15-a9-support.md).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  simd-test:
    # The differential part only runs where the CPU can execute the instructions
    # being compared (an Apple Silicon runner); on this host the CRC and decoder
    # checks still run, and everything compiles.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the differential test for core/simd.c
        run: |
          set -e
          uname -m
          make test-simd

  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          set -e
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "ios|iphoneos" || true
          cmake --version | head -1

      - name: Install xcodegen
        run: |
          set -e
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Build the engine (iOS 15, no guest network)
        run: |
          set -e
          make ios-lib HENGE_NO_NET=1 IOS_MIN=15.0 build/henge-agent.gz

      - name: Build the installer stack
        run: |
          set -e
          IOS_MIN=15.0 ./tools/build_ios_restore.sh

      - name: Build and package the app
        run: |
          set -e
          mkdir -p build/out
          HENGE_OUT="$PWD/build/out/Henge-iOS15.ipa" ./ios/scripts/package_ios15_ipa.sh

      - name: Report what was built
        if: always()
        run: |
          ls -lh build/out/*.ipa 2>/dev/null || true
          unzip -l build/out/Henge-iOS15.ipa 2>/dev/null | tail -5 || true

      - name: Upload the .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Henge-iOS15-${{ github.run_number }}
          path: |
            build/out/*.ipa
            ios/build/DerivedData-ios15.buildlog
          if-no-files-found: warn
          retention-days: 30
